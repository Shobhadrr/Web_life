<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Container Layout</title>
    <style>
        .outer-container {
            width: 500px;
            height: 500px;
            border: 4px solid purple;
            position: relative;
        }

        .inner-container {
            width: 340px;
            height: 340px;
            border: 4px solid red;
            position: absolute;
            top: 80px;
            left: 80px;
        }

        .box {
            width: 60px;
            height: 60px;
            border: 4px solid red;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }


        #box6 {
            top: 10px;
            left: 10px;
        }

        #box7 {
            top: 10px;
            right: 10px;
        }

        #box8 {
            bottom: 10px;
            left: 10px;
        }

        #box9 {
            bottom: 10px;
            right: 10px;
        }


        #box1 {
            top: 10px;
            left: 140px;
        }

        #box2 {
            top: 140px;
            left: 10px;
        }

        #box3 {
            bottom: 10px;
            left: 140px;
        }

        #box4 {
            top: 140px;
            right: 10px;
        }

        #box5 {
            top: 140px;
            left: 140px;
        }
    </style>
</head>

<body>
    <div class="outer-container">
       
        <div class="box" id="box6">6</div>
        <div class="box" id="box7">7</div>
        <div class="box" id="box8">8</div>
        <div class="box" id="box9">9</div>

        <div class="inner-container">
            <div class="box" id="box1">1</div>
            <div class="box" id="box2">2</div>
            <div class="box" id="box3">3</div>
            <div class="box" id="box4">4</div>
            <div class="box" id="box5">5</div>
        </div>
    </div>
</body>

</html>
