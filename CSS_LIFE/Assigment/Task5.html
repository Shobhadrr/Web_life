<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            width: 800px;
            height: 800px;
            border: 5px solid purple;
            position: relative;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }

        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            background-color: #fff;

            display: flex;
            justify-content: center;
            align-items: center;

            transform: translate(-50%, -50%);
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #box7 {
            top: 15%;
            left: 50%;
        }

        #box1 {
            top: 25%;
            left: 75%;
        }

        #box2 {
            top: 50%;
            left: 80%;
        }

        #box3 {
            top: 75%;
            left: 75%;
        }

        #box4 {
            top: 85%;
            left: 50%;
        }

        #box5 {
            top: 75%;
            left: 25%;
        }

        #box6 {
            top: 50%;
            left: 20%;
        }

        #box8 {
            top: 25%;
            left: 25%;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Flowers</h1>

        <div class="box" id="box7">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQVTe-COYqgj4x3Nwq_wu86NtlTRfUJeK3rc-2WDhhQlQ&s=10">
        </div>

        </div>

        <div class="box" id="box2">

        </div>

        <div class="box" id="box3">
