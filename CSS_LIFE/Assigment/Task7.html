```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Pages Chat Box</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .pages {
            position: relative;
        }

       
        .page {
            width: 1500px;
            height: 900px;

            border: 2px solid black;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        #page1 {
            background-color: pink;
        }

        #page2 {
            background-color: lightgreen;
        }

        #page3 {
            background-color: lightblue;
        }

    
        #page4 {
            background-color: peachpuff;
        }

      
        .chat-area {
            position: relative;
            height: 1800px;
        }

        .chat-container {
            position: sticky;

            top: 400px;

            margin-left: 1000px;

            width: 350px;
            height: 100px;

            display: flex;
            align-items: center;

            z-index: 10;

         
            margin-top: -450px;

            margin-bottom: 350px;
        }

        .chat-box {
            width: 250px;
            height: 45px;

            border: 2px solid black;
            border-radius: 25px;

            background-color: white;
        }

        .chat-box input {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            padding: 10px 15px;

            border-radius: 25px;
        }

        
        .chat-logo {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            border: 2px solid black;

            object-fit: cover;

            margin-left: -10px;
        }

    </style>

</head>

<body>

    <div class="pages">

       
        <div class="page" id="page1">
            Page 1
        </div>


       
        <div class="chat-area">

            <div class="page" id="page2">
                Page 2
            </div>


         
            <div class="chat-container">

                <div class="chat-box">
                    <input type="text" placeholder="Type message">
                </div>

                <img src="https://cdn.dribbble.com/userupload/42128647/file/original-be7870269cb8092d7eb6f9e3435eda7c.gif"
                     class="chat-logo"
                     alt="Chat Logo">

            </div>


            
            <div class="page" id="page3">
                Page 3
            </div>

        </div>


       
        <div class="page" id="page4">
            Page 4
        </div>

    </div>

</body>

</html>
```
