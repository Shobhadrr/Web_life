<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Layout</title>
    <style>
        .container {
            width: 500px;
            height: 600px;
            border: 2px solid purple;
            position: relative; /* Acts as the anchor point for absolute children */
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid red;
            position: absolute; /* Allows precise placement inside the container */
            display: flex;
            align-items: center;
            justify-content: center;
        }

    
        #box1 {
            top: 10px;
            left: 200px; 
        }

        
        #box2 {
            top: 250px;
            right: 10px;
        }

        /* Bottom Center */
        #box3 {
            bottom: 10px;
            left: 200px;
        }

      
        #box4 {
            top: 250px;
            left: 10px;
        }

   
        #box5 {
            top: 250px;
            left: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>

</html>
