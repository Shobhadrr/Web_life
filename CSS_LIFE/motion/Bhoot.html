<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body {
            width: 100vw;
            height: 100vh;
            align-content: center;
            display: flex;
            justify-content: center;
        }

        .main {
            width: 350px;
            height: 350px;
            border: 4px solid white;
            position: relative;
            animation: Bhoot 3s infinite linear;
            border-radius: 50%;
            border: 3px solid black;
            box-shadow: 2px 2px 5px 5px;
            background-color: black;
           

        }

        .child {
            width: 80px;
            height: 80px;
            background-color:gold;
            position: absolute;
            top: 35px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 2px 8px 10px 5px gold;


        }

        @keyframes Bhoot {
            0% {
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }

        }
    </style>
</head>

<body>
    <div class="main">
        <div class="child">


        </div>

    </div>

</body>

</html>
